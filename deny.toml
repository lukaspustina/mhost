[advisories]
ignore = [
    # rustc-serialize comes in only through the dev-dependency spectral (via num 0.1); test code
    # never parses untrusted JSON with it, and it is not part of any shipped artifact.
    { id = "RUSTSEC-2022-0004", reason = "dev-only via spectral, no untrusted input" },
    { id = "RUSTSEC-2025-0025", reason = "unmaintained, dev-only via spectral" },
    # ansi_term, atty and term come in only through the dev-dependency lit.
    { id = "RUSTSEC-2021-0139", reason = "unmaintained, dev-only via lit" },
    { id = "RUSTSEC-2024-0375", reason = "unmaintained, dev-only via lit" },
    { id = "RUSTSEC-2018-0015", reason = "unmaintained, dev-only via lit" },
    # pin-utils comes in through hyper (reqwest); no upgrade exists, hyper has to drop it.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained, transitive via hyper, no upgrade available" },
    # tokio unsound for AsyncFd constructors; mhost never uses AsyncFd, no patched release yet.
    { id = "RUSTSEC-2026-0386", reason = "AsyncFd I/O safety, unused here, no patched tokio yet" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
