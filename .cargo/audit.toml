# Read by cargo-audit and rustsec/audit-check (cron.yml); deny.toml is not. Keep in sync with the
# [advisories] ignore list in deny.toml.
[advisories]
ignore = [
    # Dev-only via spectral (rustc-serialize).
    "RUSTSEC-2022-0004",
    "RUSTSEC-2025-0025",
    # Dev-only via lit (ansi_term, atty, term).
    "RUSTSEC-2021-0139",
    "RUSTSEC-2024-0375",
    "RUSTSEC-2021-0145",
    "RUSTSEC-2018-0015",
    # pin-utils: transitive via hyper (reqwest), no upgrade available.
    "RUSTSEC-2026-0441",
    # tokio AsyncFd I/O safety: unused here, no patched release yet.
    "RUSTSEC-2026-0386",
]
